[project]
name = "clip-maker"
version = "0.1.0"
description = "Create a video from images, video segments, and a soundtrack"
requires-python = ">=3.14,<3.15"
dependencies = ["moviepy>=2.2.1,<3"]

[dependency-groups]
dev = ["numpy>=2,<3", "pillow>=11,<12"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["clip_maker"]
