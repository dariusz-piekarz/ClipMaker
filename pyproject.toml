[project]
name = "clip-maker"
version = "0.1.0"
description = "Create a video from images, video segments, and a soundtrack"
requires-python = ">=3.15"
dependencies = ["moviepy>=2,<3", "pillow>=12.3,<13"]

[tool.uv]
# MoviePy 2.2.1 caps Pillow below 12, whose Windows wheels do not support Python 3.15.
# Integration tests cover the MoviePy paths used by this project with Pillow 12.3.
override-dependencies = ["pillow>=12.3,<13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["clip_maker"]
